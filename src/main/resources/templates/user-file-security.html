<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Enkripsi File</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <a href="/user/dashboard" class="btn btn-secondary mb-3"> Kembali ke Dashboard </a>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">Enkripsi File</h4>
            </div>

            <div class="card-body">
              <form action="/file/encrypt" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                  <label class="form-label">Pilih File</label>
                  <input type="file" name="file" class="form-control" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Secret Key AES</label>
                  <input type="text" name="secretKey" class="form-control" minlength="16" maxlength="16" placeholder="Contoh: 1234567890abcdef" required />
                  <small class="text-muted">Secret key wajib tepat 16 karakter.</small>
                </div>

                <button type="submit" class="btn btn-primary">Enkripsi File</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
              <h4 class="mb-0">Dekripsi File</h4>
            </div>

            <div class="card-body">
              <form action="/file/decrypt" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                  <label class="form-label">Pilih File Terenkripsi</label>
                  <input type="file" name="file" class="form-control" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Secret Key AES</label>
                  <input type="text" name="secretKey" class="form-control" minlength="16" maxlength="16" placeholder="Masukkan key yang sama" required />
                  <small class="text-muted">Gunakan key yang sama seperti saat enkripsi.</small>
                </div>

                <button type="submit" class="btn btn-warning">Dekripsi File</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
