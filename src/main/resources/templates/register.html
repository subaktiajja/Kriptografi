<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>BUAT AKUN</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
      }

      .register-wrapper {
        width: 100%;
        max-width: 430px;
      }

      .register-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 35px 30px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
      }

      .register-header {
        text-align: center;
        margin-bottom: 28px;
      }

      .register-header h2 {
        font-size: 28px;
        color: #222;
        margin-bottom: 8px;
      }

      .register-header p {
        color: #777;
        font-size: 14px;
      }

      .alert {
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 14px;
      }

      .alert-success {
        background: #e9f9ee;
        color: #1f7a3e;
        border: 1px solid #b9ebc8;
      }

      .alert-danger {
        background: #fff0f0;
        color: #c62828;
        border: 1px solid #f5b5b5;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: bold;
        color: #333;
      }

      .form-control {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dcdcdc;
        border-radius: 12px;
        font-size: 15px;
        outline: none;
        transition: 0.25s ease;
        background: #fafafa;
      }

      .form-control:focus {
        border-color: #667eea;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
      }

      .primary-btn {
        width: 100%;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        transition: 0.25s ease;
        margin-top: 8px;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .bottom-text {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
        color: #666;
      }

      .bottom-text a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }

      .bottom-text a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .register-card {
          padding: 28px 20px;
          border-radius: 16px;
        }

        .register-header h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="register-wrapper">
      <div class="register-card">
        <div class="register-header">
          <h2>Create Account</h2>
          <p>Sign up to continue using the application</p>
        </div>

        <form method="post" th:action="@{/register}" th:object="${user}">
          <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
          </div>

          <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
          </div>

          <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>

          <div class="form-group">
            <label for="firstName">First Name</label>
            <input id="firstName" type="text" th:field="*{firstName}" class="form-control" placeholder="Enter your first name" required />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input id="lastName" type="text" th:field="*{lastName}" class="form-control" placeholder="Enter your last name" required />
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" th:field="*{username}" class="form-control" placeholder="Enter your username" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" class="form-control" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" class="form-control" placeholder="Enter your password" required />
          </div>

          <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <button type="submit" class="primary-btn">Sign Up</button>

          <div class="bottom-text">
            Sudah mempunyai akun?
            <a th:href="@{/login}">Sign In disini</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
