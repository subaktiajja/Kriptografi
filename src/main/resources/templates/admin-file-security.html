<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Keamanan File</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <a href="/admin/dashboard" class="btn btn-secondary mb-3"> Kembali ke Dashboard </a>

      <div class="card shadow-sm">
        <div class="card-header text-white" th:classappend="${mode == 'decrypt'} ? ' bg-warning text-dark' : ' bg-primary'">
          <h4 class="mb-0" th:text="${title}">Keamanan File</h4>
        </div>

        <div class="card-body">
          <p th:text="${description}">Deskripsi halaman.</p>

          <form th:action="${mode == 'decrypt'} ? @{/file/decrypt} : @{/file/encrypt}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Pilih File</label>
              <input type="file" name="file" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Secret Key AES</label>
              <input type="text" name="secretKey" class="form-control" minlength="16" maxlength="16" placeholder="Contoh: 1234567890abcdef" required />
              <small class="text-muted">Secret key wajib tepat 16 karakter.</small>
            </div>

            <button type="submit" class="btn" th:classappend="${mode == 'decrypt'} ? ' btn-warning' : ' btn-primary'">
              <span th:text="${mode == 'decrypt'} ? 'Dekripsi File' : 'Enkripsi File'"> Proses File </span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
