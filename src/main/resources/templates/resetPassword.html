<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow">
            <div class="card-header text-center">
              <h4>Reset Password</h4>
            </div>

            <div class="card-body">
              <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

              <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="mb-3">
                  <label class="form-label">Password Baru</label>
                  <input type="password" name="newPassword" class="form-control" placeholder="Masukkan password baru" required minlength="6" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Konfirmasi Password</label>
                  <input type="password" name="confirmPassword" class="form-control" placeholder="Ulangi password baru" required minlength="6" />
                </div>

                <button type="submit" class="btn btn-success w-100">Simpan Password Baru</button>
              </form>

              <div class="text-center mt-3">
                <a th:href="@{/login}">Kembali ke Login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
