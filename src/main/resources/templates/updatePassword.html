<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Update Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #fff;
        padding: 30px;
        border-radius: 16px;
        width: 360px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        color: #1e3c72;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #1e3c72;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
      }
      .msg {
        margin-top: 15px;
        text-align: center;
        color: green;
      }
      .err {
        margin-top: 15px;
        text-align: center;
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Update Password</h2>

      <form id="resetForm">
        <input type="hidden" name="token" th:value="${token}" />

        <label>Password Baru</label>
        <input type="password" name="newPassword" placeholder="Masukkan password baru" required />

        <button type="submit">Simpan Password</button>
      </form>

      <div id="message"></div>
    </div>

    <script>
      document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const params = new URLSearchParams(formData);

        const response = await fetch('/user/savePassword', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: params,
        });

        const msg = document.getElementById('message');

        try {
          const data = await response.json();

          if (data.message === 'Password berhasil diubah') {
            msg.className = 'msg';
            msg.innerText = data.message;

            setTimeout(() => {
              window.location.href = '/login';
            }, 2000);
          } else {
            msg.className = 'err';
            msg.innerText = data.message;
          }
        } catch (error) {
          msg.className = 'err';
          msg.innerText = 'Terjadi kesalahan saat menyimpan password';
        }
      });
    </script>
  </body>
</html>
